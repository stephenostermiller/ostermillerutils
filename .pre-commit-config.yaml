repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of file marker
      - id: check-yaml
        name: Check YAML files
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: check-xml
        name: Check XML files
        files: \.xml$
      - id: detect-private-key
        name: Detect private keys

  - repo: local
    hooks:
      - id: condense-blank-lines
        name: Condense multiple blank lines
        entry: src/build/script/condense-blank-lines.sh
        language: script
        types: [text]
      - id: check-tab-indentation
        name: Check tab indentation
        entry: src/build/script/check-tab-indentation.sh
        language: script
        files: |
          (?x)^(
            .*\.java|
            .*\.sh|
            .*\.pl|
            Makefile
          )$
      - id: maven-compile
        name: Maven compile
        entry: mvn compile
        language: system
        types: [java]
        pass_filenames: false
        stages: [commit]
